name: Generate annotations for GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    # 仓库可能尚未包含 taixuan.txt；Pages 可先使用已生成的 web/annotations.html。
    if: hashFiles('taixuan.txt') != ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate annotations.html
        working-directory: taixuan-jing
        run: python gen_html.py

      - name: Upload generated annotation page
        uses: actions/upload-artifact@v4
        with:
          name: annotations-page
          path: web/annotations.html
