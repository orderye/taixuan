<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>太玄经 · 卜卦占筮</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231A1A2E'/><text x='50' y='70' font-size='56' text-anchor='middle' fill='%23C4A062' font-family='Kaiti,serif'>%E7%8E%84</text></svg>">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="back-bar" class="back-bar" style="display:none">
      <button class="back-btn" data-act="goBack">‹ 返回</button>
      <span class="back-title"></span>
    </header>

    <main id="page-container"></main>

    <nav id="tab-bar" class="tab-bar">
      <div class="tab-bar-bg"></div>
      <div class="tab-bar-inner">
        <button class="tab-item" data-key="index" data-act="switchTab">
          <span class="tab-icon">玄</span><span class="tab-label">首页</span><span class="tab-indicator"></span>
        </button>
        <button class="tab-item" data-key="divine" data-act="switchTab">
          <span class="tab-icon">卜</span><span class="tab-label">卜卦</span><span class="tab-indicator"></span>
        </button>
        <button class="tab-item" data-key="browse" data-act="switchTab">
          <span class="tab-icon">览</span><span class="tab-label">浏览</span><span class="tab-indicator"></span>
        </button>
        <button class="tab-item" data-key="history" data-act="switchTab">
          <span class="tab-icon">录</span><span class="tab-label">历史</span><span class="tab-indicator"></span>
        </button>
      </div>
      <div class="tab-bar-safe-bottom"></div>
    </nav>
  </div>

  <div id="tx-toast" class="tx-toast"></div>
  <div id="tx-modal" class="tx-modal-mask"></div>

  <!-- 转换后的数据 / 引擎模块 -->
  <script src="js/data.js"></script>
  <script src="js/annotations.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/types.js"></script>
  <script src="js/intent-dict.js"></script>
  <script src="js/util.js"></script>

  <!-- 核心框架 -->
  <script src="js/app.js"></script>

  <!-- 各页面模块（自注册到 TXPages） -->
  <script src="js/pages/index.js"></script>
  <script src="js/pages/divine.js"></script>
  <script src="js/pages/browse.js"></script>
  <script src="js/pages/detail.js"></script>
  <script src="js/pages/result.js"></script>
  <script src="js/pages/history.js"></script>
  <script src="js/pages/about.js"></script>

  <script>TXApp.start();</script>
</body>
</html>
